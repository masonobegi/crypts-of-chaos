<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- THE `$` USED TO BE A `<text>` ELEMENT AND NEVER RENDERED ANYWHERE.
       Godot rasterises SVG through thorvg, which does not implement <text> at
       all — no error, no warning, the glyph simply is not in the image. So the
       icon on the taskbar, in the Steam library and in the Windows Details tab
       was a teal square, a white cross and an unexplained red dot, and the one
       thing the mark is ABOUT (medicine, and what it costs) was missing from
       it. Anything that has to appear in a rasterised SVG has to be a shape. -->
  <rect width="128" height="128" rx="18" fill="#1b3a4b"/>
  <rect x="52" y="22" width="24" height="84" rx="4" fill="#e8f1f2"/>
  <rect x="22" y="52" width="84" height="24" rx="4" fill="#e8f1f2"/>
  <circle cx="96" cy="98" r="18" fill="#c2504b"/>
  <rect x="94.5" y="86" width="3" height="24" rx="1.5" fill="#fff"/>
  <path d="M101.6 92.6 C 99.4 90.2, 92.2 90.0, 91.2 93.6
           C 90.2 97.2, 95.4 98.4, 98.6 99.5
           C 102.4 100.8, 102.6 104.2, 99.8 105.6
           C 97.2 106.9, 92.4 106.4, 90.4 103.8"
        fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
</svg>
